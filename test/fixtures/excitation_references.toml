about = "Reference tangent-space excitation levels of Z2 phi^4 states, shared by the Julia package RcmpsCore and the Python/CUDA package rcmps_gpu (gpu/). Each [[levels]] entry is the level `level` (1 is the lowest) of one excitation_eigsolve solve of [states.<state>] with [settings.<settings>], `sector`, `momentum` and `nev`. benchmark/excitation_references.jl recomputes the entries with regenerate = true with RcmpsCore and checks them (--update rewrites their computed fields); gpu/tests/excitations/test_references.py recomputes the D = 4 levels with the NumPy backend, and the D = 16 ones with RCMPS_EXCITATION_SLOW=1; gpu/qualification/excitations/check_references.py recomputes the D = 16 and D = 32 levels on a GPU. A recomputation agrees when its validated energy and its four validation energies are within `tolerance` of the stored ones and its Ritz energy within `ritz_tolerance`. The gpu_* fields hold the values of the A100 runs of rcmps_gpu at the same settings. The [fields] table describes every level field."
convention = "H = H_free(m=1) + g ∫ dx :φ⁴: (no 1/4!), normal ordered at mass one, as in RcmpsCore 0.2; energies are excitation energies above the ground state in units of that mass"
format = "rcmps-excitation-references"
format_version = 1

[fields]
accepted = "the level passed the validation (energies agree within validation_tol, fresh residuals within acceptance_residual)"
action_calls = "Hamiltonian actions of the solve, preconditioner excluded"
check_spread = "mass-scan entries: largest difference between the tight action energy and the two bilinear energies"
computed = "when the values were computed (UTC)"
converged = "the Davidson search reached its residual target"
dimension = "dimension of the sector coordinates"
energy_spread = "largest difference among the four validation energies"
four_energies = "validation energies [standard action, refined action, bilinear, refined bilinear] (r.validation: standard_energy, refined_energy, bilinear_energy, refined_bilinear_energy)"
gpu_computed = "date of that run (UTC)"
gpu_four_energies = "four validation energies of that run"
gpu_numops = "Davidson operator applications of that run"
gpu_ritz_energy = "Ritz energy of that run"
gpu_run = "A100 run of rcmps_gpu at the same state, settings, sector and momentum (results directory of the research record)"
gpu_sources_sha256 = "sha256 of the run's settings.source_sha256 table as in rcmps_gpu.excitations.cli.QUALIFIED_SOURCES_SHA256 (68c84931... is the qualified final2 table that the package sources derive from)"
gpu_validated_energy = "validated energy of that run"
julia_threads = "Julia threads of the computation (BLAS one thread)"
julia_version = "Julia version of the computation"
level = "index of this level in the solve, 1 for the lowest"
momentum = "momentum p"
name = "unique name of the entry"
nev = "number of levels of the solve"
numops = "Davidson operator applications of the solve"
rcmpscore_source = "the RcmpsCore sources of the computation"
rcmpscore_version = "RcmpsCore version of the computation"
regenerate = "true: benchmark/excitation_references.jl recomputes it (and --update rewrites its computed fields)"
residual = "Davidson residual of the level at the end of the search (r.residuals)"
ritz_energy = "Davidson Ritz energy at the standard settings (r.energies)"
ritz_tolerance = "largest admissible difference of ritz_energy for such a recomputation"
sector = "parity sector: odd or even"
settings = "key of [settings]"
source = "where a value not computed by benchmark/excitation_references.jl was recorded"
start = "start vectors used: field (field insertion) or kinetic (lowest coarse kinetic modes)"
state = "key of [states]"
stop_reason = "why the Davidson search stopped"
tolerance = "largest admissible difference of validated_energy and of each four_energies entry for a recomputation at these settings, by either implementation"
tolerance_basis = "what the tolerances rest on"
validated_energy = "validated energy: the bilinear energy at the refined settings (r.validated_energies)"
wall_seconds = "wall time of the solve (the excitation_eigsolve call; for the mass-scan entries the whole research run)"
window_change = "mass-scan entries: difference between the bilinear energies at the standard and tight settings"


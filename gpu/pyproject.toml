[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rcmps-gpu"
dynamic = ["version"]   # rcmps_gpu.__version__, which plan.json records
description = "CUDA implementations of RcmpsCore: FP64 ground-state optimizer (Z2 or unsymmetric RCMPS) and tangent-space excitation solver (Z2 RCMPS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]   # a copy of the repository LICENSE
authors = [{ name = "Antoine Tilloy" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    # The ODE integrators import scipy.integrate._ivp.dop853_coefficients, a private module.
    "scipy>=1.16,<1.18",
    "h5py>=3.8",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x[ctk]~=14.2"]
test = ["pytest>=8"]

[project.scripts]
rcmps-gpu-optimize = "rcmps_gpu.optimizer.cli:main"
rcmps-gpu-excitations = "rcmps_gpu.excitations.cli:main"

[tool.hatch.version]
path = "src/rcmps_gpu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rcmps_gpu"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/qualification", "/README.md", "/LICENSE", "/IMPORTED_FROM_RESEARCH.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
